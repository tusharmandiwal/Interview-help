<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Interview Prep — 100 Questions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e29;
  --surface: #1e2330;
  --surface2: #252b3b;
  --border: #2e3447;
  --border2: #3d4560;
  --text: #e8ecf4;
  --muted: #7a84a0;
  --accent: #5b7cf6;
  --accent2: #8b5cf6;
  --green: #34d399;
  --amber: #fbbf24;
  --coral: #f87171;
  --teal: #22d3ee;
  --pink: #f472b6;
  --tag-core: #1e3a5f;
  --tag-core-t: #60a5fa;
  --tag-di: #2d1b69;
  --tag-di-t: #a78bfa;
  --tag-boot: #064e3b;
  --tag-boot-t: #34d399;
  --tag-mvc: #451a03;
  --tag-mvc-t: #fbbf24;
  --tag-data: #14532d;
  --tag-data-t: #86efac;
  --tag-sec: #450a0a;
  --tag-sec-t: #f87171;
  --tag-aop: #431407;
  --tag-aop-t: #fb923c;
  --tag-tx: #1c1917;
  --tag-tx-t: #a8a29e;
  --tag-cloud: #4a044e;
  --tag-cloud-t: #f0abfc;
  --tag-test: #083344;
  --tag-test-t: #22d3ee;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', Georgia, serif;
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
}

/* — NOISE OVERLAY — */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

/* — HEADER — */
header {
  position: relative;
  padding: 60px 40px 50px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #0a0c12 0%, var(--bg) 100%);
  overflow: hidden;
}

header::after {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(91,124,246,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.header-inner {
  max-width: 900px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.badge {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid rgba(91,124,246,0.35);
  padding: 4px 12px;
  border-radius: 2px;
  margin-bottom: 20px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: #fff;
  margin-bottom: 14px;
}

h1 span {
  color: var(--accent);
}

.sub {
  font-family: 'Lora', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 15px;
  margin-bottom: 32px;
}

/* — CONTROLS — */
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 240px;
}

.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

#search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  padding: 11px 14px 11px 42px;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.2s;
}

#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }

.pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.pill {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.pill:hover { border-color: var(--border2); color: var(--text); background: var(--surface); }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* — MAIN — */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 40px 80px;
  position: relative;
  z-index: 1;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.stats-label {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}

.expand-btn {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* — QUESTION CARD — */
.qcard {
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  background: var(--bg2);
  overflow: hidden;
  transition: border-color 0.2s;
}

.qcard:hover { border-color: var(--border2); }
.qcard.open { border-color: rgba(91,124,246,0.4); background: var(--surface); }

.qhead {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
}

.qnum {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  min-width: 26px;
  flex-shrink: 0;
}

.qtxt {
  flex: 1;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  line-height: 1.4;
}

.qcard.open .qtxt { color: #fff; }

.qtag {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}

.chevron {
  flex-shrink: 0;
  color: var(--muted);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.qcard.open .chevron { transform: rotate(180deg); color: var(--accent); }

/* — ANSWER BODY — */
.qbody {
  display: none;
  padding: 0 20px 18px 60px;
  font-family: 'Lora', serif;
  font-size: 14px;
  line-height: 1.8;
  color: #b0bac8;
  border-top: 1px solid var(--border);
}

.qbody.show { display: block; }

.qbody code {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  background: rgba(91,124,246,0.12);
  color: #93a8f4;
  padding: 1px 6px;
  border-radius: 3px;
}

.qbody pre {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  background: #0a0c12;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  color: #93a8f4;
  padding: 14px 16px;
  border-radius: 4px;
  overflow-x: auto;
  margin: 10px 0;
  line-height: 1.6;
}

.qbody strong {
  color: var(--text);
  font-weight: 600;
}

/* — TOPIC COLORS — */
.tag-core   { background: var(--tag-core);   color: var(--tag-core-t); }
.tag-di     { background: var(--tag-di);     color: var(--tag-di-t); }
.tag-boot   { background: var(--tag-boot);   color: var(--tag-boot-t); }
.tag-mvc    { background: var(--tag-mvc);    color: var(--tag-mvc-t); }
.tag-data   { background: var(--tag-data);   color: var(--tag-data-t); }
.tag-sec    { background: var(--tag-sec);    color: var(--tag-sec-t); }
.tag-aop    { background: var(--tag-aop);    color: var(--tag-aop-t); }
.tag-tx     { background: var(--tag-tx);     color: var(--tag-tx-t); }
.tag-cloud  { background: var(--tag-cloud);  color: var(--tag-cloud-t); }
.tag-test   { background: var(--tag-test);   color: var(--tag-test-t); }

/* — NO RESULTS — */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
}

/* — SCROLL TOP — */
.scroll-top {
  position: fixed;
  bottom: 32px; right: 32px;
  width: 40px; height: 40px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.2s, transform 0.2s;
  z-index: 100;
}
.scroll-top.visible { opacity: 1; transform: translateY(0); }

/* — ANIMATIONS — */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.qcard { animation: fadeIn 0.25s ease both; }

@media (max-width: 640px) {
  header { padding: 40px 20px 36px; }
  main { padding: 24px 16px 60px; }
  .qtag { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">Interview Prep · Spring Framework</div>
    <h1>100 Spring <span>Questions</span></h1>
    <p class="sub">Core · DI · Boot · MVC · Data · Security · AOP · Transactions · Cloud · Testing</p>

    <div class="controls">
      <div class="search-wrap">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search" placeholder="Search questions or answers…" oninput="render()">
      </div>
    </div>

    <div class="pills" style="margin-top:14px" id="pills"></div>
  </div>
</header>

<main>
  <div class="stats-row">
    <span class="stats-label" id="stats"></span>
    <button class="expand-btn" onclick="toggleAll()">Expand all</button>
  </div>
  <div id="list"></div>
</main>

<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script>
const TOPICS = [
  {id:'all',  label:'All'},
  {id:'core', label:'Core Spring'},
  {id:'di',   label:'DI'},
  {id:'boot', label:'Spring Boot'},
  {id:'mvc',  label:'Spring MVC'},
  {id:'data', label:'Spring Data'},
  {id:'sec',  label:'Security'},
  {id:'aop',  label:'AOP'},
  {id:'tx',   label:'Transactions'},
  {id:'cloud',label:'Spring Cloud'},
  {id:'test', label:'Testing'},
];

const Q = [
{
  id: 'core',
  q: 'What is the Spring Framework?',
  a: `
<h3>📖 Definition</h3>

<p>
<strong>Spring Framework</strong> is a lightweight, open-source Java framework used to build enterprise applications. It simplifies Java development by providing features like Dependency Injection (DI), Inversion of Control (IoC), Transaction Management, Spring MVC, Spring Security, and Spring Data JPA.
</p>

<h3>🤔 Why do we need Spring?</h3>

<ul>
<li>Reduces boilerplate code.</li>
<li>Promotes loose coupling between classes.</li>
<li>Makes applications easier to test and maintain.</li>
<li>Provides ready-to-use modules for web, database, security, and microservices.</li>
<li>Lets developers focus on business logic instead of infrastructure code.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring scans the project for components.</li>
<li>Creates required objects (Beans).</li>
<li>Injects dependencies automatically.</li>
<li>Manages the complete lifecycle of beans.</li>
<li>Provides various modules based on application requirements.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Service
public class UserService {

}

@RestController
public class UserController {

    private final UserService userService;

    public UserController(UserService userService) {
        this.userService = userService;
    }
}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Lightweight and open-source.</li>
<li>Uses IoC and Dependency Injection.</li>
<li>Supports modular development.</li>
<li>Spring Boot is built on top of Spring Framework.</li>
<li>Widely used for enterprise and microservice applications.</li>
</ul>
`
},

{
  id: 'core',
  q: 'What is the Spring IoC Container?',
  a: `
<h3>📖 Definition</h3>

<p>
The <strong>IoC (Inversion of Control) Container</strong> is the core of the Spring Framework. It creates, configures, manages, and destroys Spring Beans throughout the application lifecycle.
</p>

<h3>🤔 Why do we need IoC Container?</h3>

<ul>
<li>Removes manual object creation.</li>
<li>Automatically injects dependencies.</li>
<li>Manages bean lifecycle.</li>
<li>Reduces tight coupling.</li>
<li>Makes applications easier to maintain and test.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Application starts.</li>
<li>Spring reads configuration or annotations.</li>
<li>Creates all required beans.</li>
<li>Injects dependencies between beans.</li>
<li>Stores beans inside the ApplicationContext.</li>
<li>Destroys beans when the application shuts down.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Component
public class Engine {

}

@Component
public class Car {

    private final Engine engine;

    public Car(Engine engine) {
        this.engine = engine;
    }
}
</code></pre>

<p>
Spring automatically creates both objects and injects the <code>Engine</code> into the <code>Car</code>.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Core component of Spring.</li>
<li>Creates and manages Spring Beans.</li>
<li>Performs Dependency Injection.</li>
<li>Manages Bean Lifecycle.</li>
<li>Main implementations are BeanFactory and ApplicationContext.</li>
</ul>
`
},

{
  id: 'core',
  q: 'What is a Spring Bean?',
  a: `
<h3>📖 Definition</h3>

<p>
A <strong>Spring Bean</strong> is any Java object that is created, managed, and maintained by the Spring IoC Container.
</p>

<p>
Instead of creating objects using the <code>new</code> keyword, Spring creates them automatically and injects them wherever required.
</p>

<h3>🤔 Why do we need Spring Beans?</h3>

<ul>
<li>Automatic object creation.</li>
<li>Automatic dependency injection.</li>
<li>Lifecycle management.</li>
<li>Improves code reusability.</li>
<li>Easy unit testing.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring scans classes annotated with <code>@Component</code>, <code>@Service</code>, <code>@Repository</code>, etc.</li>
<li>Creates objects of those classes.</li>
<li>Stores them inside the IoC Container.</li>
<li>Injects them wherever needed.</li>
<li>Manages their lifecycle automatically.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Service
public class ProductService {

}

@RestController
public class ProductController {

    private final ProductService productService;

    public ProductController(ProductService productService) {
        this.productService = productService;
    }
}
</code></pre>

<p>
Here, both <code>ProductService</code> and <code>ProductController</code> are Spring Beans managed by the IoC Container.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>A Bean is simply an object managed by Spring.</li>
<li>Default bean scope is Singleton.</li>
<li>Beans are stored inside the ApplicationContext.</li>
<li>Beans can be created using annotations or <code>@Bean</code> methods.</li>
<li>Spring manages the complete bean lifecycle.</li>
</ul>
`
},
  {
  id: 'core',
  q: 'What are the different Bean Scopes in Spring?',
  a: `
<h3>📖 Definition</h3>

<p>
A <strong>Bean Scope</strong> defines how many instances of a Spring Bean are created and how long those instances live inside the Spring IoC Container.
</p>

<h3>🤔 Why do we need Bean Scopes?</h3>

<ul>
<li>Control the lifecycle of beans.</li>
<li>Decide whether a bean should be shared or newly created.</li>
<li>Improve memory usage.</li>
<li>Support different application requirements such as web requests and user sessions.</li>
</ul>

<h3>⚙️ Types of Bean Scopes</h3>

<table border="1" cellpadding="6" cellspacing="0">
<tr>
<th>Scope</th>
<th>Description</th>
</tr>

<tr>
<td><code>singleton</code></td>
<td>One shared object for the entire Spring Container (Default).</td>
</tr>

<tr>
<td><code>prototype</code></td>
<td>A new object is created every time the bean is requested.</td>
</tr>

<tr>
<td><code>request</code></td>
<td>One bean is created for each HTTP request.</td>
</tr>

<tr>
<td><code>session</code></td>
<td>One bean is created for each user session.</td>
</tr>

<tr>
<td><code>application</code></td>
<td>One bean is shared across the entire web application.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>@Component
@Scope("prototype")
public class ReportGenerator {

}
</code></pre>

<p>
Every time Spring requests <code>ReportGenerator</code>, a new object is created.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Default scope is <code>singleton</code>.</li>
<li><code>prototype</code> creates a new object every time.</li>
<li>Request, Session and Application scopes are available only in web applications.</li>
<li>Choose the scope based on application requirements.</li>
</ul>
`
},

{
  id: 'core',
  q: 'What is the difference between BeanFactory and ApplicationContext?',
  a: `
<h3>📖 Definition</h3>

<p>
Both <strong>BeanFactory</strong> and <strong>ApplicationContext</strong> are Spring IoC Containers. ApplicationContext is an advanced version of BeanFactory that provides many additional enterprise features.
</p>

<h3>🤔 Why do we need two containers?</h3>

<ul>
<li>BeanFactory provides basic dependency injection.</li>
<li>ApplicationContext provides enterprise-level features.</li>
<li>Modern Spring Boot applications use ApplicationContext.</li>
</ul>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6" cellspacing="0">

<tr>
<th>BeanFactory</th>
<th>ApplicationContext</th>
</tr>

<tr>
<td>Basic IoC Container</td>
<td>Advanced IoC Container</td>
</tr>

<tr>
<td>Lazy Bean Initialization</td>
<td>Eager Singleton Initialization</td>
</tr>

<tr>
<td>No Event Support</td>
<td>Supports Events</td>
</tr>

<tr>
<td>No Internationalization</td>
<td>Supports i18n</td>
</tr>

<tr>
<td>Limited Features</td>
<td>Supports AOP, Profiles, Environment, Validation</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>ApplicationContext context =
        new AnnotationConfigApplicationContext(AppConfig.class);

UserService service =
        context.getBean(UserService.class);
</code></pre>

<p>
Spring Boot automatically creates an <code>ApplicationContext</code> when the application starts.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>ApplicationContext extends BeanFactory.</li>
<li>ApplicationContext is used in almost every Spring Boot application.</li>
<li>BeanFactory is rarely used directly in modern applications.</li>
</ul>
`
},

{
  id: 'core',
  q: 'What is the Spring Bean Lifecycle?',
  a: `
<h3>📖 Definition</h3>

<p>
The <strong>Bean Lifecycle</strong> describes the complete journey of a Spring Bean from its creation until it is destroyed by the Spring Container.
</p>

<h3>🤔 Why is Bean Lifecycle important?</h3>

<ul>
<li>Initialize resources before using a bean.</li>
<li>Release resources before application shutdown.</li>
<li>Customize bean behavior during creation.</li>
<li>Improve resource management.</li>
</ul>

<h3>⚙️ Bean Lifecycle Steps</h3>

<ol>
<li>Spring creates the Bean.</li>
<li>Dependencies are injected.</li>
<li><code>BeanPostProcessor</code> executes before initialization.</li>
<li><code>@PostConstruct</code> method is called.</li>
<li>Bean becomes ready for use.</li>
<li><code>BeanPostProcessor</code> executes after initialization.</li>
<li>When the application stops, <code>@PreDestroy</code> method is called.</li>
<li>Bean is destroyed.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Component
public class DatabaseConnection {

    @PostConstruct
    public void init() {
        System.out.println("Connection Created");
    }

    @PreDestroy
    public void destroy() {
        System.out.println("Connection Closed");
    }
}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Spring manages the complete lifecycle automatically.</li>
<li><code>@PostConstruct</code> runs after dependency injection.</li>
<li><code>@PreDestroy</code> runs before bean destruction.</li>
<li>BeanPostProcessor can customize beans before and after initialization.</li>
</ul>
`
},
  {
  id: 'core',
  q: 'What are Spring Configuration Metadata Types?',
  a: `
<h3>📖 Definition</h3>

<p>
Configuration Metadata tells the Spring IoC Container how to create, configure, and manage Spring Beans. It defines what beans should be created, their dependencies, and their lifecycle.
</p>

<h3>🤔 Why do we need Configuration Metadata?</h3>

<ul>
<li>To tell Spring which classes should become Beans.</li>
<li>To configure dependencies between Beans.</li>
<li>To avoid creating objects manually.</li>
<li>To make application configuration easy to maintain.</li>
</ul>

<h3>⚙️ Types of Configuration</h3>

<table border="1" cellpadding="6">
<tr>
<th>Type</th>
<th>Description</th>
</tr>

<tr>
<td>XML Configuration</td>

</tr>

<tr>
<td>Java Configuration</td>
<td>Uses <code>@Configuration</code> and <code>@Bean</code> methods to define Beans.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>@Configuration
public class AppConfig {

    @Bean
    public UserService userService() {

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Modern Spring Boot applications mainly use Annotation + Java Configuration.</li>
<li>XML configuration is mostly used in legacy projects.</li>
<li>Java Configuration provides type safety and better readability.</li>
</ul>

  q: 'What is @Conditional?',
  a: `
<h3>📖 Definition</h3>

<p>
<code>@Conditional</code> is an annotation that tells Spring to create a Bean only if a specified condition is true. If the condition is not satisfied, Spring skips creating that Bean.
</p>

<h3>🤔 Why do we need @Conditional?</h3>

<ul>
<li>Create Beans only when required.</li>
<li>Avoid unnecessary Bean creation.</li>
<li>Support different environments (Dev, Test, Production).</li>
<li>Enable or disable features based on configuration.</li>
<li>Used heavily by Spring Boot Auto Configuration.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring starts scanning configuration classes.</li>
<li>It checks the condition specified in <code>@Conditional</code>.</li>
<li>If the condition is true, the Bean is created.</li>
<li>If the condition is false, the Bean is ignored.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Configuration
public class AppConfig {

    @Bean
    @ConditionalOnProperty(
        name = "feature.email.enabled",
        havingValue = "true"
    )
    public EmailService emailService() {
        return new EmailService();
    }

}
</code></pre>

<p>
If <code>feature.email.enabled=true</code>, Spring creates the <code>EmailService</code> bean. Otherwise, it is skipped.
</p>

<h3>⭐ Common Conditional Annotations</h3>

<ul>
<li><code>@ConditionalOnClass</code> – Create Bean if a class exists.</li>
<li><code>@ConditionalOnMissingBean</code> – Create Bean only if another Bean doesn't exist.</li>
<li><code>@ConditionalOnBean</code> – Create Bean only if another Bean exists.</li>
<li><code>@ConditionalOnProperty</code> – Create Bean based on a property value.</li>
<li><code>@ConditionalOnWebApplication</code> – Create Bean only in a web application.</li>
</ul>

<h3>⭐ Key Points</h3>

<ul>
<li>Controls Bean creation.</li>
<li>Reduces unnecessary configuration.</li>
<li>Widely used inside Spring Boot Auto Configuration.</li>
<li>Helps create flexible and configurable applications.</li>
</ul>
`

  a: `
<h3>📖 Definition</h3>

<p>
Spring's Event System allows different parts of an application to communicate with each other without being tightly coupled. One component publishes an event, and other components can listen and react to it.
</p>

<h3>🤔 Why do we need Events?</h3>

<ul>
<li>Reduce dependency between components.</li>
<li>Execute additional tasks after an action.</li>
<li>Improve application modularity.</li>
<li>Support asynchronous processing.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>An event is created.</li>
<li>The event is published using <code>ApplicationEventPublisher</code>.</li>
<li>Spring notifies all matching event listeners.</li>
<li>The listener executes its business logic.</li>
</ol>

<h3>💻 Demo Code</h3>

<p><strong>Publish an Event</strong></p>

<pre><code>@Service
public class UserService {

    @Autowired
    private ApplicationEventPublisher publisher;

    public void registerUser() {

        // Save user

        publisher.publishEvent(new UserRegisteredEvent(this));

    }

}
</code></pre>

<p><strong>Listen for the Event</strong></p>

<pre><code>@Component
public class EmailListener {

    @EventListener
    public void sendWelcomeEmail(UserRegisteredEvent event) {

        System.out.println("Welcome Email Sent");

    }

}
</code></pre>

<h3>⭐ Common Built-in Events</h3>

<ul>
<li><code>ContextRefreshedEvent</code></li>
<li><code>ContextStartedEvent</code></li>
<li><code>ContextStoppedEvent</code></li>
<li><code>ContextClosedEvent</code></li>
<li><code>ApplicationReadyEvent</code> (Spring Boot)</li>
</ul>

<h3>⭐ Key Points</h3>

<ul>
<li>Based on the Publisher-Subscriber pattern.</li>
<li>Uses <code>ApplicationEventPublisher</code> to publish events.</li>
<li>Uses <code>@EventListener</code> to receive events.</li>
<li>Can be combined with <code>@Async</code> for asynchronous event handling.</li>
<li>Helps build loosely coupled applications.</li>
</ul>
`

{
    id: 'di',
    q: 'What is Dependency Injection (DI)?',
    a: `
<h3>📖 Definition</h3>

<p>
<strong>Dependency Injection (DI)</strong> is a design pattern in which the Spring IoC Container creates the required objects (called dependencies) and injects them into another class instead of the class creating them using the <code>new</code> keyword.
</p>

<p>
This reduces the dependency between classes, making the application easier to maintain, test, and extend.
</p>

<h3>🤔 Why do we need Dependency Injection?</h3>

<ul>
<li>Reduces tight coupling between classes.</li>
<li>Makes code reusable and modular.</li>
<li>Improves unit testing by allowing mock objects.</li>
<li>Allows changing implementations without modifying business logic.</li>
<li>Spring automatically manages object creation and dependency injection.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring scans the application for Beans.</li>
<li>The IoC Container creates the required Bean objects.</li>
<li>It checks which Bean depends on another Bean.</li>
<li>Spring automatically injects the required dependency.</li>
<li>The application uses the injected object without creating it manually.</li>
</ol>

<h3>💻 Demo Code</h3>

<p><strong>Without Dependency Injection</strong></p>

<pre><code>public class Car {

    private Engine engine = new Engine();

}
</code></pre>

<p>The <code>Car</code> class is tightly coupled to the <code>Engine</code> class because it creates the object itself.</p>

<p><strong>With Dependency Injection</strong></p>

<pre><code>@Component
public class Engine {

}

@Component
public class Car {

    private final Engine engine;

    public Car(Engine engine) {
        this.engine = engine;
    }

}
</code></pre>

<p>Spring automatically creates both Beans and injects the <code>Engine</code> into the <code>Car</code>.</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Dependency Injection is an implementation of IoC.</li>
<li>Spring manages object creation instead of the developer.</li>
<li>Promotes loose coupling.</li>
<li>Constructor Injection is the recommended approach.</li>
</ul>
`
},

{
    id: 'di',
    q: 'Constructor Injection vs Setter Injection',
    a: `
<h3>📖 Definition</h3>

<p>
Spring provides multiple ways to inject dependencies into a Bean. The two most common approaches are <strong>Constructor Injection</strong> and <strong>Setter Injection</strong>.
</p>

<h3>🤔 Why do we need different injection types?</h3>

<ul>
<li>Some dependencies are mandatory.</li>
<li>Some dependencies are optional.</li>
<li>Different situations require different injection styles.</li>
</ul>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6">

<tr>
<th>Constructor Injection</th>
<th>Setter Injection</th>
</tr>

<tr>
<td>Dependencies are passed through the constructor.</td>
<td>Dependencies are injected using setter methods.</td>
</tr>

<tr>
<td>Best for mandatory dependencies.</td>
<td>Best for optional dependencies.</td>
</tr>

<tr>
<td>Supports <code>final</code> fields.</td>
<td>Fields cannot be final.</td>
</tr>

<tr>
<td>Object is fully initialized after creation.</td>
<td>Dependency can be changed later.</td>
</tr>

<tr>
<td>Recommended in modern Spring Boot.</td>
<td>Less commonly used.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>Constructor Injection</strong></p>

<pre><code>@Service
public class UserService {

    private final UserRepository repository;

    public UserService(UserRepository repository) {
        this.repository = repository;
    }

}
</code></pre>

<p><strong>Setter Injection</strong></p>

<pre><code>@Service
public class UserService {

    private UserRepository repository;

    @Autowired
    public void setRepository(UserRepository repository) {
        this.repository = repository;
    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Use Constructor Injection for mandatory dependencies.</li>
<li>Use Setter Injection for optional dependencies.</li>
<li>Spring recommends Constructor Injection.</li>
</ul>
`
},

{

    q: 'What is @Autowired?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@Autowired</code> is an annotation that tells Spring to automatically inject a matching Bean into another Bean.
</p>

<p>
Instead of creating objects manually, Spring searches the IoC Container for a matching Bean and injects it automatically.
</p>

<h3>🤔 Why do we need @Autowired?</h3>

<ul>
<li>Removes manual object creation.</li>
<li>Automatically resolves dependencies.</li>
<li>Reduces boilerplate code.</li>
<li>Works with Constructor, Setter, and Field Injection.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring creates all Beans.</li>
<li>When it finds <code>@Autowired</code>, it searches for a matching Bean.</li>
<li>If one Bean is found, it is injected automatically.</li>
<li>If multiple Beans are found, use <code>@Qualifier</code> or <code>@Primary</code>.</li>
<li>If no matching Bean exists, Spring throws an exception.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Service
public class PaymentService {

}

@RestController
public class OrderController {

    private final PaymentService paymentService;

    @Autowired
    public OrderController(PaymentService paymentService) {
        this.paymentService = paymentService;
    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Injects Beans automatically.</li>
<li>Works by type.</li>
<li>Can be used on constructors, setters, and fields.</li>
<li>Constructor Injection is the preferred approach.</li>
<li>Use <code>@Qualifier</code> when multiple Beans of the same type exist.</li>
</ul>
`
},

{
    id: 'di',
    q: 'What is @Qualifier?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@Qualifier</code> is used along with <code>@Autowired</code> to specify which Bean should be injected when multiple Beans of the same type are available.
</p>

<p>
Without <code>@Qualifier</code>, Spring cannot decide which Bean to inject and throws <code>NoUniqueBeanDefinitionException</code>.
</p>

<h3>🤔 Why do we need @Qualifier?</h3>

<ul>
<li>Resolve ambiguity when multiple Beans of the same type exist.</li>
<li>Select a specific implementation.</li>
<li>Give more control over dependency injection.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring searches for all Beans of the required type.</li>
<li>If only one Bean exists, it injects it automatically.</li>
<li>If multiple Beans exist, Spring checks for <code>@Qualifier</code>.</li>
<li>The Bean whose name matches the qualifier is injected.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>public interface PaymentService{
    void pay();
}

@Service("upiPayment")
class UpiPaymentService implements PaymentService{

    public void pay(){ }

}

@Service("cardPayment")
class CardPaymentService implements PaymentService{

    public void pay(){ }

}

@Service
class OrderService{

    private final PaymentService paymentService;

    public OrderService(
            @Qualifier("upiPayment")
            PaymentService paymentService){

        this.paymentService = paymentService;

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Used with <code>@Autowired</code>.</li>
<li>Resolves multiple Bean conflicts.</li>
<li>Selects a specific Bean by name.</li>
<li>Takes higher priority than <code>@Primary</code>.</li>
</ul>
`

{
    id: 'di',
    q: 'What is @Primary?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@Primary</code> marks a Bean as the default Bean to use when multiple Beans of the same type are available.
</p>

<p>
If no <code>@Qualifier</code> is specified, Spring injects the Bean marked with <code>@Primary</code>.
</p>

<h3>🤔 Why do we need @Primary?</h3>

<ul>
<li>Provide a default implementation.</li>
<li>Avoid writing <code>@Qualifier</code> everywhere.</li>
<li>Simplify dependency injection.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring finds multiple Beans of the same type.</li>
<li>It checks whether one Bean is marked with <code>@Primary</code>.</li>
<li>If found, that Bean is injected automatically.</li>
<li>If <code>@Qualifier</code> is present, it overrides <code>@Primary</code>.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>public interface NotificationService{

    void send();

}

@Service
@Primary
class EmailService implements NotificationService{

    public void send(){ }

}

@Service
class SmsService implements NotificationService{

    public void send(){ }

}

@Service
class UserService{

    private final NotificationService notificationService;

    public UserService(NotificationService notificationService){

        this.notificationService = notificationService;

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Marks the default Bean.</li>
<li>Works only when multiple Beans exist.</li>
<li><code>@Qualifier</code> overrides <code>@Primary</code>.</li>
<li>Useful when one implementation is used most of the time.</li>
</ul>
`

<h3>📖 Definition</h3>

<p>
Both <code>@Inject</code> and <code>@Autowired</code> are used for Dependency Injection. Their purpose is the same, but they come from different libraries.
</p>

<h3>🤔 Why are there two annotations?</h3>

<ul>
<li><code>@Autowired</code> is provided by Spring Framework.</li>
<li><code>@Inject</code> is part of the Jakarta Dependency Injection (JSR-330) specification.</li>
<li>Spring supports both annotations.</li>
</ul>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6">

<tr>
<th>@Autowired</th>
<th>@Inject</th>
</tr>

<tr>
<td>Spring-specific annotation.</td>
<td>Jakarta (JSR-330) standard.</td>
</tr>

<tr>
<td>Package: <code>org.springframework.beans.factory.annotation</code></td>
<td>Package: <code>jakarta.inject</code></td>
</tr>

<tr>
<td>Supports <code>required=false</code>.</td>
<td>No <code>required</code> attribute.</td>
</tr>

<tr>
<td>Works with <code>@Qualifier</code>.</td>
<td>Usually works with <code>@Named</code>.</td>
</tr>

<tr>
<td>Most commonly used in Spring Boot.</td>
<td>Useful when writing framework-independent code.</td>
</tr>

</code></pre>

</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Both perform Dependency Injection.</li>
<li><code>@Autowired</code> is Spring-specific.</li>
<li><code>@Inject</code> follows the Jakarta standard.</li>
<li>In Spring Boot projects, <code>@Autowired</code> is more commonly used.</li>
</ul>
`

{
    id: 'di',
    q: 'What is Circular Dependency in Spring?',
    a: `
<h3>📖 Definition</h3>

<p>
A <strong>Circular Dependency</strong> occurs when two or more Spring Beans depend on each other directly or indirectly. Since each bean waits for the other to be created first, Spring cannot complete the dependency injection process.
</p>

<p>
For example, if <code>Bean A</code> depends on <code>Bean B</code>, and <code>Bean B</code> also depends on <code>Bean A</code>, a circular dependency is created.
</p>

<h3>🤔 Why is it a problem?</h3>

<ul>
<li>Spring cannot create the required beans.</li>
<li>The application may fail to start.</li>
<li>It indicates tightly coupled design.</li>
<li>Makes the application difficult to maintain.</li>
</ul>

<h3>⚙️ How it works</h3>

<p><strong>Normal Dependency</strong></p>

<pre><code>A  →  B  →  C
</code></pre>

<p>Spring creates C, then B, then A.</p>

<p><strong>Circular Dependency</strong></p>

<pre><code>A  →  B
↑     ↓
└─────┘
</code></pre>

<p>
Neither Bean can be created first, so Spring throws a <code>BeanCurrentlyInCreationException</code>.
</p>

<h3>💻 Demo Code</h3>

<pre><code>@Service
class ServiceA {

    private final ServiceB serviceB;

    public ServiceA(ServiceB serviceB) {
        this.serviceB = serviceB;
    }

}

@Service
class ServiceB {

    private final ServiceA serviceA;

    public ServiceB(ServiceA serviceA) {
        this.serviceA = serviceA;
    }

}
</code></pre>

<h3>✅ Ways to Resolve It</h3>

<ul>
<li>Redesign the application to remove the dependency cycle.</li>
<li>Use <code>@Lazy</code> on one dependency.</li>
<li>Use Setter Injection if appropriate.</li>
<li>Create a separate service to handle shared logic.</li>
</ul>

<h3>⭐ Key Points</h3>

<ul>
<li>Constructor Injection cannot resolve circular dependencies.</li>
<li>Usually indicates poor application design.</li>
<li>Best solution is to redesign the classes.</li>
</ul>
`
},

{

    q: 'What is @Value?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@Value</code> is an annotation used to inject values into a Spring Bean. These values can come from <code>application.properties</code>, <code>application.yml</code>, environment variables, system properties, or Spring Expression Language (SpEL).
</p>

<h3>🤔 Why do we need @Value?</h3>

<ul>
<li>Read configuration values.</li>
<li>Avoid hardcoding values in code.</li>
<li>Support different configurations for different environments.</li>
<li>Inject constant values into Beans.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>Spring loads configuration files.</li>
<li>It searches for the property key.</li>
<li>The value is injected into the Bean.</li>
<li>The Bean can use the value anywhere in the application.</li>
</ol>

<h3>💻 Demo Code</h3>

<p><strong>application.properties</strong></p>

<pre><code>spring.application.name=InventoryService
server.port=8081
</code></pre>

<p><strong>Reading Values</strong></p>

<pre><code>@Component
public class AppInfo {

    @Value("\${server.port}")

}
</code></pre>

<pre><code>@Value("\${server.port:8080}")
private int port;
</code></pre>

<p>
If the property is missing, Spring uses <code>8080</code> as the default value.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Reads values from configuration files.</li>
<li>Supports default values.</li>
<li>Can evaluate SpEL expressions.</li>
<li>Mainly used for simple configuration values.</li>
</ul>
`

{
    id: 'di',
    q: 'What is Spring Expression Language (SpEL)?',
    a: `
<h3>📖 Definition</h3>

<p>
Spring Expression Language (<strong>SpEL</strong>) is a powerful expression language used to evaluate expressions at runtime. It can access Bean properties, call methods, perform calculations, and evaluate conditions.
</p>

<h3>🤔 Why do we need SpEL?</h3>

<ul>
<li>Perform dynamic calculations.</li>
<li>Read Bean properties.</li>
<li>Call methods inside expressions.</li>
<li>Write dynamic configuration.</li>
<li>Used in Spring Security and @Value.</li>
</ul>

<h3>⚙️ Common Uses</h3>

<ul>
<li>Inside <code>@Value</code></li>
<li>Spring Security (<code>@PreAuthorize</code>)</li>
<li>Conditional configuration</li>
<li>Bean property access</li>

    q: 'What is Lazy Initialization (@Lazy)?',
    a: `
<h3>📖 Definition</h3>

<p>
By default, Spring creates all <strong>Singleton</strong> Beans when the application starts. This is called <strong>Eager Initialization</strong>.
</p>

<p>
The <code>@Lazy</code> annotation tells Spring to delay the creation of a Bean until it is actually needed for the first time. This is known as <strong>Lazy Initialization</strong>.
</p>

<h3>🤔 Why do we need @Lazy?</h3>

<ul>
<li>Reduce application startup time.</li>
<li>Create expensive objects only when required.</li>
<li>Save memory during application startup.</li>
<li>Help resolve some circular dependency issues.</li>
</ul>

<h3>⚙️ How it works</h3>

<p><strong>Without @Lazy</strong></p>

<pre><code>Application Starts
        │
        ▼
Spring creates all Singleton Beans
        │
        ▼
Application Ready
</code></pre>

<p><strong>With @Lazy</strong></p>

<pre><code>Application Starts
        │
        ▼
Bean is NOT created
        │
        ▼
Bean is requested
        │
        ▼
Spring creates the Bean
</code></pre>

<h3>💻 Demo Code</h3>

<pre><code>@Component
@Lazy
public class ReportGenerator {

    public ReportGenerator() {
        System.out.println("Bean Created");
    }

}
</code></pre>

<p>
The <code>ReportGenerator</code> Bean will be created only when another Bean requests it.
</p>

<p><strong>Using @Lazy during Injection</strong></p>

<pre><code>@Service
public class UserService {

    private final ReportGenerator generator;

    public UserService(@Lazy ReportGenerator generator) {
        this.generator = generator;
    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Default Spring behavior is Eager Initialization.</li>
<li><code>@Lazy</code> delays Bean creation.</li>
<li>Improves startup performance.</li>
<li>Useful for expensive or rarely used Beans.</li>
</ul>
`
},

{
    id: 'di',
    q: 'What is Lookup Method Injection (@Lookup)?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@Lookup</code> is used when a <strong>Singleton Bean</strong> needs a new instance of a <strong>Prototype Bean</strong> every time a method is called.
</p>

<p>
Normally, if a Prototype Bean is injected into a Singleton Bean, Spring injects it only once. Using <code>@Lookup</code>, Spring creates a fresh Prototype Bean whenever the method is invoked.
</p>

<h3>🤔 Why do we need @Lookup?</h3>

<ul>
<li>Allow Singleton Beans to use Prototype Beans correctly.</li>
<li>Create a new object on every method call.</li>
<li>Avoid manually fetching Beans from ApplicationContext.</li>
</ul>

<h3>⚙️ How it works</h3>

<p><strong>Without @Lookup</strong></p>

<pre><code>Singleton Bean
      │
      ▼
Prototype Bean

Only one Prototype object is injected.
</code></pre>

<p><strong>With @Lookup</strong></p>

<pre><code>Singleton Bean
      │
      ├────► Prototype Object 1
      ├────► Prototype Object 2
      └────► Prototype Object 3
</code></pre>

<p>
Every method call returns a brand-new Prototype Bean.
</p>

<h3>💻 Demo Code</h3>

<pre><code>@Component
@Scope("prototype")
public class Task {

}

@Component
public class TaskManager {

    public void process() {

        Task task = getTask();

        // Use Task

    }

    @Lookup
    public Task getTask() {
        return null;
    }

}
</code></pre>

<p>
Spring overrides the <code>getTask()</code> method at runtime and returns a new <code>Task</code> object every time it is called.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Used when Singleton depends on Prototype.</li>
<li>Returns a new Prototype Bean on every call.</li>
<li>Implemented internally using Spring-generated subclasses.</li>
<li>Rarely used in normal Spring Boot applications but important to know.</li>
</ul>
`

<h3>📖 Definition</h3>

<p>
Both <code>CommandLineRunner</code> and <code>ApplicationRunner</code> are callback interfaces provided by Spring Boot. They are used to execute code <strong>after the Spring ApplicationContext has been fully initialized</strong> and before the application starts serving requests.
</p>

<p>
They are commonly used for tasks such as loading initial data, creating default users, validating configuration, or performing startup logic.
</p>

<h3>🤔 Why do we need them?</h3>

<ul>
<li>Insert default or sample data into the database.</li>
<li>Run initialization logic after application startup.</li>
<li>Validate configuration or external connections.</li>
<li>Execute startup tasks automatically.</li>
</ul>

<h3>⚙️ Difference</h3>

<table border="1" cellpadding="6">

<tr>
<th>CommandLineRunner</th>
<th>ApplicationRunner</th>
</tr>

<tr>
<td>Receives command-line arguments as <code>String[]</code>.</td>
<td>Receives arguments as an <code>ApplicationArguments</code> object.</td>
</tr>

<tr>
<td>Simple to use.</td>
<td>Provides methods to access option and non-option arguments.</td>
</tr>

<tr>
<td>Suitable for basic startup tasks.</td>
<td>Better when command-line arguments need to be processed.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>CommandLineRunner</strong></p>

<pre><code>@Component
public class DataLoader implements CommandLineRunner {

    @Override
    public void run(String... args) {

        System.out.println("Application Started");

    }

}
</code></pre>

<p><strong>ApplicationRunner</strong></p>

<pre><code>@Component
public class DataLoader implements ApplicationRunner {

        }

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Both execute after the Spring Boot application starts.</li>
<li>Both are commonly used for startup tasks.</li>
<li><code>ApplicationRunner</code> provides better support for command-line arguments.</li>
<li>If command-line arguments are not required, <code>CommandLineRunner</code> is usually sufficient.</li>
</ul>

It is designed only for the development environment and is automatically excluded from production builds.
</p>

<h3>🤔 Why do we need DevTools?</h3>

<ul>
<li>Automatically restart the application after code changes.</li>
<li>Reduce development time.</li>
<li>Improve developer productivity.</li>
<li>Disable template caching during development.</li>
<li>Support automatic browser refresh using LiveReload.</li>

<h3>⚙️ Features</h3>

Now whenever you modify and save a Java class, Spring Boot automatically restarts the application.

<h3>⭐ Key Points</h3>

<li>Automatically restarts the application.</li>

<li>Improves development speed.</li>
<li>Automatically excluded from production deployments.</li>

    q: 'What is Spring MVC?',
    a: `
<h3>📖 Definition</h3>

<p>
<strong>Spring MVC (Model-View-Controller)</strong> is a web framework built on top of the Java Servlet API. It helps developers build web applications and REST APIs by separating an application into three layers:
</p>

<ul>
<li><strong>Model</strong> - Contains the business logic and data.</li>
<li><strong>View</strong> - Displays data to the user.</li>
<li><strong>Controller</strong> - Handles HTTP requests and coordinates between the Model and View.</li>
</ul>

<h3>🤔 Why do we need Spring MVC?</h3>

<ul>
<li>Separates business logic from presentation logic.</li>
<li>Makes applications easier to develop and maintain.</li>
<li>Provides annotation-based request handling.</li>
<li>Supports REST APIs and traditional web applications.</li>
<li>Integrates seamlessly with other Spring modules.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>User sends an HTTP request.</li>
<li><code>DispatcherServlet</code> receives the request.</li>
<li>It finds the appropriate Controller.</li>
<li>The Controller calls the Service layer.</li>
<li>The Service interacts with the Repository/Database.</li>
<li>The Controller returns a View or JSON response.</li>
<li>The response is sent back to the client.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@RestController
@RequestMapping("/products")
public class ProductController {

    @GetMapping
    public List&lt;Product&gt; getProducts() {

        return List.of();

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Built on the Servlet API.</li>
<li>Follows the MVC design pattern.</li>
<li>Supports both Web Applications and REST APIs.</li>
<li>Uses DispatcherServlet as the Front Controller.</li>
</ul>
`

{

    q: 'What is DispatcherServlet?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>DispatcherServlet</code> is the <strong>Front Controller</strong> of Spring MVC. Every incoming HTTP request first reaches the DispatcherServlet, which coordinates the complete request processing workflow.
</p>

<h3>🤔 Why do we need DispatcherServlet?</h3>

<ul>
<li>Provides a single entry point for all requests.</li>
<li>Routes requests to the correct Controller.</li>
<li>Reduces duplicate request handling logic.</li>
<li>Manages the complete request-response lifecycle.</li>
</ul>

<h3>⚙️ Request Flow</h3>

<pre><code>
Browser
   │
   ▼
DispatcherServlet
   │
   ▼
Handler Mapping
   │
   ▼
Controller
   │
   ▼
Service
   │
   ▼
Repository
   │
   ▼
Controller
   │
   ▼
DispatcherServlet
   │
   ▼
JSON / View
</code></pre>

<h3>💻 Demo Code</h3>

<pre><code>@RestController
@RequestMapping("/users")
public class UserController {

    @GetMapping("/{id}")
    public User getUser(@PathVariable Long id){

        return new User();

    }

}
</code></pre>

<p>
When <code>/users/1</code> is requested, the DispatcherServlet receives the request and forwards it to the <code>getUser()</code> method.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Main controller of Spring MVC.</li>
<li>Receives every HTTP request.</li>
<li>Uses HandlerMapping to locate Controllers.</li>
<li>Returns View or JSON response.</li>
</ul>
`

{
    id: 'mvc',
    q: '@RequestMapping and HTTP Method Shortcuts',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@RequestMapping</code> is used to map an HTTP request to a Controller or Controller method. It specifies which URL should invoke a particular method.
</p>

<p>
Since specifying the HTTP method repeatedly can be verbose, Spring MVC provides shortcut annotations like <code>@GetMapping</code>, <code>@PostMapping</code>, <code>@PutMapping</code>, <code>@DeleteMapping</code>, and <code>@PatchMapping</code>.
</p>

<h3>🤔 Why do we need Request Mapping?</h3>

<ul>
<li>Map URLs to Controller methods.</li>
<li>Handle different HTTP methods.</li>
<li>Organize REST APIs.</li>
<li>Avoid writing servlet code manually.</li>
</ul>

<h3>⚙️ HTTP Method Shortcuts</h3>

<table border="1" cellpadding="6">

<tr>
<th>Annotation</th>
<th>Purpose</th>
</tr>

<tr>
<td><code>@GetMapping</code></td>
<td>Retrieve data.</td>
</tr>

<tr>
<td><code>@PostMapping</code></td>
<td>Create new data.</td>
</tr>

<tr>
<td><code>@PutMapping</code></td>
<td>Update an existing resource completely.</td>
</tr>

<tr>
<td><code>@PatchMapping</code></td>
<td>Update part of a resource.</td>
</tr>

<tr>
<td><code>@DeleteMapping</code></td>
<td>Delete a resource.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>@RestController
@RequestMapping("/products")
public class ProductController {

    @GetMapping
    public List&lt;Product&gt; getAllProducts() {

        return List.of();

    }

    @GetMapping("/{id}")
    public Product getProduct(@PathVariable Long id) {

        return new Product();

    }

    @PostMapping
    public Product createProduct(@RequestBody Product product) {

        return product;

    }

    @PutMapping("/{id}")
    public Product updateProduct(@PathVariable Long id,
                                 @RequestBody Product product) {

        return product;

    }

    @DeleteMapping("/{id}")
    public void deleteProduct(@PathVariable Long id) {

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li><code>@RequestMapping</code> is the base mapping annotation.</li>
<li>HTTP shortcut annotations make code cleaner.</li>
<li>Most REST APIs mainly use GET, POST, PUT and DELETE.</li>
<li>Can be used at both class and method level.</li>
</ul>
`

    id: 'mvc',
    q: '@PathVariable vs @RequestParam',
    a: `
<h3>📖 Definition</h3>

<p>
Both annotations are used to receive values from an HTTP request, but they get the values from different places.
</p>

<ul>
<li><code>@PathVariable</code> reads values from the URL path.</li>
<li><code>@RequestParam</code> reads values from the query string.</li>
</ul>

<h3>🤔 When should we use them?</h3>

<ul>
<li>Use <code>@PathVariable</code> to identify a specific resource.</li>
<li>Use <code>@RequestParam</code> for filtering, searching, pagination, or optional values.</li>
</ul>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6">

<tr>
<th>@PathVariable</th>
<th>@RequestParam</th>
</tr>

<tr>
<td>Reads value from URL.</td>
<td>Reads value from query string.</td>
</tr>

<tr>
<td>Usually mandatory.</td>
<td>Can be optional.</td>
</tr>

<tr>
<td>Used for resource identification.</td>
<td>Used for filtering and searching.</td>
</tr>

<tr>
<td>Example: <code>/users/10</code></td>
<td>Example: <code>/users?page=1</code></td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>@PathVariable</strong></p>

<pre><code>@GetMapping("/users/{id}")
public User getUser(@PathVariable Long id) {

    return new User();

}
</code></pre>

<p>Request URL</p>

<pre><code>GET /users/101
</code></pre>

<p><strong>@RequestParam</strong></p>

<pre><code>@GetMapping("/users")
public List&lt;User&gt; getUsers(

    @RequestParam(defaultValue = "1") int page,

    @RequestParam(defaultValue = "10") int size

) {

    return List.of();

}
</code></pre>

<p>Request URL</p>

<pre><code>GET /users?page=2&size=20
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li><code>@PathVariable</code> extracts values from the URL path.</li>
<li><code>@RequestParam</code> extracts query parameters.</li>
<li><code>@RequestParam</code> supports default values and optional parameters.</li>
<li>Both can be used together in the same API.</li>
</ul>
`

{
    id: 'mvc',
    q: '@RequestBody and @ResponseBody',
    a: `
<h3>📖 Definition</h3>

<p>
<code>@RequestBody</code> converts the incoming HTTP request body (usually JSON) into a Java object.
</p>

<p>
<code>@ResponseBody</code> converts a Java object into JSON or XML and sends it back in the HTTP response.
</p>

<p>
These conversions are performed automatically using Spring's <strong>HttpMessageConverter</strong>.
</p>

<h3>🤔 Why do we need them?</h3>

<ul>
<li>Receive JSON data from clients.</li>
<li>Return Java objects as JSON.</li>
<li>Avoid manual JSON parsing.</li>
<li>Simplify REST API development.</li>
</ul>

<h3>⚙️ How it works</h3>

<p><strong>Request Flow</strong></p>

<pre><code>
Client
   │
   ▼
JSON Request
   │
   ▼
@RequestBody
   │
   ▼
Java Object
   │
Business Logic
   │
Java Object
   │
   ▼
@ResponseBody
   │
   ▼
JSON Response
</code></pre>

<h3>💻 Demo Code</h3>

<pre><code>@RestController
@RequestMapping("/products")
public class ProductController {

    @PostMapping
    public Product createProduct(
            @RequestBody Product product) {

        return product;

    }

}
</code></pre>

<p>
The client sends JSON:</p>

<pre><code>{
    "name":"Laptop",
    "price":65000
}
</code></pre>

<p>
Spring converts the JSON into a <code>Product</code> object. Since the controller is a <code>@RestController</code>, the returned object is automatically converted back into JSON.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li><code>@RequestBody</code> converts JSON to a Java object.</li>
<li><code>@ResponseBody</code> converts a Java object to JSON.</li>
<li><code>@RestController</code> automatically applies <code>@ResponseBody</code> to every method.</li>
<li>Uses <code>HttpMessageConverter</code> internally.</li>
</ul>
`

{
    id: 'mvc',
    q: 'What is ResponseEntity?',
    a: `
<h3>📖 Definition</h3>

<p>
<code>ResponseEntity&lt;T&gt;</code> is a class in Spring MVC that represents the complete HTTP response. It allows you to control the <strong>response body</strong>, <strong>HTTP status code</strong>, and <strong>response headers</strong>.
</p>

<p>
Instead of returning only an object, you can return a <code>ResponseEntity</code> to provide additional information to the client.
</p>

<h3>🤔 Why do we need ResponseEntity?</h3>

<ul>
<li>Return custom HTTP status codes.</li>
<li>Add response headers.</li>
<li>Return success or error responses.</li>
<li>Provide complete control over HTTP responses.</li>
</ul>

<h3>⚙️ ResponseEntity Components</h3>

<table border="1" cellpadding="6">

<tr>
<th>Component</th>
<th>Description</th>
</tr>

<tr>
<td>Body</td>
<td>Actual response data.</td>
</tr>

<tr>
<td>Status</td>
<td>HTTP status code (200, 201, 404, etc.).</td>
</tr>

<tr>
<td>Headers</td>
<td>Additional HTTP response headers.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>Return Success Response</strong></p>

<pre><code>@GetMapping("/{id}")
public ResponseEntity&lt;Product&gt; getProduct(
        @PathVariable Long id) {

    Product product = service.getProduct(id);

    return ResponseEntity.ok(product);

}
</code></pre>

<p><strong>Return Created Response</strong></p>

<pre><code>@PostMapping
public ResponseEntity&lt;Product&gt; createProduct(
        @RequestBody Product product) {

    Product saved = service.save(product);

    return ResponseEntity
            .status(HttpStatus.CREATED)
            .body(saved);

}
</code></pre>

<p><strong>Return Not Found</strong></p>

<pre><code>return ResponseEntity.notFound().build();
</code></pre>

<h3>⭐ Common Methods</h3>

<ul>
<li><code>ok()</code> → HTTP 200</li>
<li><code>status()</code> → Custom status</li>
<li><code>created()</code> → HTTP 201</li>
<li><code>badRequest()</code> → HTTP 400</li>
<li><code>notFound()</code> → HTTP 404</li>
<li><code>noContent()</code> → HTTP 204</li>
</ul>

<h3>⭐ Key Points</h3>

<ul>
<li>Represents the complete HTTP response.</li>
<li>Controls body, headers, and status code.</li>
<li>Commonly used in REST APIs.</li>
<li>Recommended when returning different HTTP status codes.</li>
</ul>
`
},

{
    id: 'mvc',
    q: '@ExceptionHandler and @ControllerAdvice',
    a: `
<h3>📖 Definition</h3>

<p>
When an exception occurs in a Spring MVC application, it should be handled properly instead of exposing stack traces to the client.
</p>

<ul>
<li><code>@ExceptionHandler</code> handles exceptions within a single Controller.</li>
<li><code>@ControllerAdvice</code> handles exceptions globally across all Controllers.</li>
</ul>

<h3>🤔 Why do we need Global Exception Handling?</h3>

<ul>
<li>Return meaningful error messages.</li>
<li>Avoid duplicate try-catch blocks.</li>
<li>Centralize exception handling.</li>
<li>Improve API consistency.</li>
</ul>

<h3>⚙️ Difference</h3>

<table border="1" cellpadding="6">

<tr>
<th>@ExceptionHandler</th>
<th>@ControllerAdvice</th>
</tr>

<tr>
<td>Works for one Controller.</td>
<td>Works for all Controllers.</td>
</tr>

<tr>
<td>Local exception handling.</td>
<td>Global exception handling.</td>
</tr>

<tr>
<td>Used for controller-specific errors.</td>
<td>Used for application-wide errors.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>Controller Specific</strong></p>

<pre><code>@ExceptionHandler(ProductNotFoundException.class)
public ResponseEntity&lt;String&gt; handleException(
        ProductNotFoundException ex){

    return ResponseEntity
            .status(HttpStatus.NOT_FOUND)
            .body(ex.getMessage());

}
</code></pre>

<p><strong>Global Exception Handler</strong></p>

<pre><code>@RestControllerAdvice
public class GlobalExceptionHandler {

    @ExceptionHandler(ProductNotFoundException.class)
    public ResponseEntity&lt;String&gt; handleException(
            ProductNotFoundException ex){

        return ResponseEntity
                .status(HttpStatus.NOT_FOUND)
                .body(ex.getMessage());

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li><code>@ExceptionHandler</code> handles exceptions for one Controller.</li>
<li><code>@ControllerAdvice</code> handles exceptions globally.</li>
<li><code>@RestControllerAdvice</code> automatically returns JSON responses.</li>
<li>Helps build consistent REST APIs.</li>
</ul>
`
},

{
    id: 'mvc',
    q: 'What is HandlerInterceptor?',
    a: `
<h3>📖 Definition</h3>

<p>
A <strong>HandlerInterceptor</strong> is a Spring MVC component that intercepts HTTP requests before and after they reach a Controller.
</p>

<p>
It is commonly used for logging, authentication, authorization, request timing, and auditing.
</p>

<h3>🤔 Why do we need HandlerInterceptor?</h3>

<ul>
<li>Log incoming requests.</li>
<li>Authenticate users.</li>
<li>Measure request processing time.</li>
<li>Execute logic before and after Controller execution.</li>
</ul>

<h3>⚙️ Lifecycle Methods</h3>

<table border="1" cellpadding="6">

<tr>
<th>Method</th>
<th>When it Executes</th>
</tr>

<tr>
<td><code>preHandle()</code></td>
<td>Before Controller execution.</td>
</tr>

<tr>
<td><code>postHandle()</code></td>
<td>After Controller execution but before response is returned.</td>
</tr>

<tr>
<td><code>afterCompletion()</code></td>
<td>After the complete request is finished.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>public class LoggingInterceptor
        implements HandlerInterceptor {

    @Override
    public boolean preHandle(
            HttpServletRequest request,
            HttpServletResponse response,
            Object handler) {

        System.out.println("Request Started");

        return true;

    }

    @Override
    public void afterCompletion(
            HttpServletRequest request,
            HttpServletResponse response,
            Object handler,
            Exception ex) {

        System.out.println("Request Completed");

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Intercepts requests before and after Controller execution.</li>
<li>Different from Servlet Filters because it works inside Spring MVC.</li>
<li>Commonly used for logging, authentication, and auditing.</li>
<li>Provides three lifecycle methods.</li>
</ul>
`
},
{
    id: 'mvc',
    q: 'What is Content Negotiation?',
    a: `
<h3>📖 Definition</h3>

<p>
<strong>Content Negotiation</strong> is the process by which Spring MVC determines the format of the response that should be sent to the client. Depending on what the client requests, the same API can return data in different formats such as <strong>JSON</strong> or <strong>XML</strong>.
</p>

<p>
Spring mainly uses the <code>Accept</code> HTTP header to determine the preferred response format.
</p>

<h3>🤔 Why do we need Content Negotiation?</h3>

<ul>
<li>Allow different clients to receive data in different formats.</li>
<li>Support JSON, XML, and other media types.</li>
<li>Improve API flexibility.</li>
<li>Follow HTTP standards.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>The client sends an HTTP request.</li>
<li>The request contains an <code>Accept</code> header.</li>
<li>Spring checks the requested media type.</li>
<li><code>ContentNegotiationManager</code> selects the appropriate <code>HttpMessageConverter</code>.</li>
<li>The response is converted into the requested format.</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@RestController
@RequestMapping("/products")
public class ProductController {

    @GetMapping(
        produces = {
            MediaType.APPLICATION_JSON_VALUE,
            MediaType.APPLICATION_XML_VALUE
        }
    )
    public Product getProduct() {

        return new Product();

    }

}
</code></pre>

<p><strong>Request JSON</strong></p>

<pre><code>GET /products
Accept: application/json
</code></pre>

<p><strong>Response</strong></p>

<pre><code>{
    "id":1,
    "name":"Laptop"
}
</code></pre>

<p><strong>Request XML</strong></p>

<pre><code>GET /products
Accept: application/xml
</code></pre>

<p><strong>Response</strong></p>

<pre><code>&lt;Product&gt;
    &lt;id&gt;1&lt;/id&gt;
    &lt;name&gt;Laptop&lt;/name&gt;
&lt;/Product&gt;
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Determines the response format.</li>
<li>Mainly uses the HTTP <code>Accept</code> header.</li>
<li>Uses <code>HttpMessageConverter</code> internally.</li>
<li>Supports JSON, XML, and other media types.</li>
</ul>
`
},

{
    id: 'mvc',
    q: 'What is CORS and how to configure it?',
    a: `
<h3>📖 Definition</h3>

<p>
<strong>CORS (Cross-Origin Resource Sharing)</strong> is a browser security mechanism that controls whether a web application can access resources from a different origin (domain, protocol, or port).
</p>

<p>
For example, if your React application runs on <code>http://localhost:3000</code> and your Spring Boot API runs on <code>http://localhost:8080</code>, the browser blocks the request unless CORS is enabled.
</p>

<h3>🤔 Why do we need CORS?</h3>

<ul>
<li>Allow frontend and backend applications running on different origins to communicate.</li>
<li>Protect applications from unauthorized cross-origin requests.</li>
<li>Enable secure communication between client and server.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>A browser sends a cross-origin request.</li>
<li>The server checks whether the origin is allowed.</li>
<li>If allowed, the server sends CORS headers.</li>
<li>The browser verifies those headers.</li>
<li>If the headers are valid, the request succeeds; otherwise, it is blocked.</li>
</ol>

<h3>💻 Configure CORS for a Controller</h3>

<pre><code>@RestController
@RequestMapping("/products")

<h3>📖 Definition</h3>

<p>
Both <code>save()</code> and <code>saveAndFlush()</code> are methods provided by <code>JpaRepository</code> to persist entities. The main difference is when the SQL statement is sent to the database.
</p>

<h3>🤔 Why do we have two methods?</h3>

<ul>
<li>Improve database performance.</li>
<li>Delay SQL execution when immediate synchronization isn't required.</li>
<li>Provide control over when changes are written to the database.</li>
</ul>

<h3>⚙️ Difference</h3>

<table border="1" cellpadding="6">

<tr>
<th>save()</th>
<th>saveAndFlush()</th>
</tr>

<tr>
<td>Saves the entity in the Persistence Context.</td>
<td>Saves the entity and immediately flushes changes to the database.</td>
</tr>

<tr>
<td>SQL may execute later before transaction commit.</td>
<td>SQL executes immediately.</td>
</tr>

<tr>
<td>Better for normal CRUD operations.</td>
<td>Useful when later operations depend on updated database data.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>Using save()</strong></p>

<pre><code>Product product = repository.save(product);
</code></pre>

<p>The SQL may execute later when the transaction is committed.</p>

<p><strong>Using saveAndFlush()</strong></p>

<pre><code>Product product =
        repository.saveAndFlush(product);
</code></pre>

<p>The INSERT or UPDATE SQL is executed immediately.</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Both methods save an entity.</li>
<li><code>saveAndFlush()</code> immediately synchronizes with the database.</li>
<li><code>save()</code> is sufficient for most applications.</li>
<li>Use <code>saveAndFlush()</code> only when immediate database synchronization is required.</li>
</ul>
`

    q: 'What is the N+1 Problem?',
    a: `
<h3>📖 Definition</h3>

<p>
The <strong>N+1 Problem</strong> is a performance issue that occurs when Hibernate executes one query to fetch the main entities and then executes an additional query for each entity to fetch its related data.
</p>

<p>
Instead of executing a single optimized query, Hibernate executes <strong>1 + N</strong> queries, where <strong>N</strong> is the number of records retrieved.
</p>

<h3>🤔 Why is it a problem?</h3>

<ul>
<li>Increases the number of database queries.</li>
<li>Slows down application performance.</li>
<li>Creates unnecessary database load.</li>
<li>Becomes a major issue when retrieving large datasets.</li>
</ul>

<h3>⚙️ How it happens</h3>

<p><strong>Example</strong></p>

<p>Suppose each Product belongs to a Category.</p>

<pre><code>@Entity
class Product {

    @ManyToOne(fetch = FetchType.LAZY)
    private Category category;

}
</code></pre>

<p>When fetching all products:</p>

<pre><code>List&lt;Product&gt; products =
        repository.findAll();
</code></pre>

<p>Hibernate executes:</p>

<pre><code>Query 1
SELECT * FROM products;

Query 2
SELECT * FROM category WHERE id=1;

Query 3
SELECT * FROM category WHERE id=2;

Query 4
SELECT * FROM category WHERE id=3;

...
</code></pre>

<p>
One query loads Products, and additional queries load Categories for each Product.
</p>

<h3>💻 How to Solve It</h3>

<p><strong>Using JOIN FETCH</strong></p>

<pre><code>@Query("""
SELECT p
FROM Product p
JOIN FETCH p.category
""")
List&lt;Product&gt; findAllProducts();
</code></pre>

<p><strong>Using @EntityGraph</strong></p>

<pre><code>@EntityGraph(attributePaths = "category")
List&lt;Product&gt; findAll();
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>N+1 is a Hibernate performance problem.</li>
<li>Mostly occurs with LAZY relationships.</li>
<li>Use <code>JOIN FETCH</code> or <code>@EntityGraph</code> to reduce queries.</li>
<li>Always monitor generated SQL for large datasets.</li>
</ul>
`
},

<h3>📖 Definition</h3>

<li>Execute bulk database operations.</li>

<li>The database is updated.</li>
</ol>

</code></pre>

    a: `
<h3>📖 Definition</h3>

<p>
Spring Data JPA supports two types of custom queries:
</p>

<ul>
<li><strong>JPQL (Java Persistence Query Language)</strong></li>
<li><strong>Native SQL</strong></li>
</ul>

<p>
JPQL works with <strong>Entities</strong>, while Native SQL works directly with <strong>Database Tables</strong>.
</p>

<h3>🤔 Why do we need both?</h3>

<ul>
<li>JPQL provides database independence.</li>
<li>Native SQL allows using database-specific features.</li>
<li>Choose the appropriate query based on the requirement.</li>
</ul>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6">

<tr>
<th>JPQL</th>
<th>Native SQL</th>
</tr>

<tr>
<td>Uses Entity names.</td>
<td>Uses table names.</td>
</tr>

<tr>
<td>Uses Entity fields.</td>
<td>Uses column names.</td>
</tr>

<tr>
<td>Database independent.</td>
<td>Database dependent.</td>
</tr>

<tr>
<td>Portable across databases.</td>
<td>May require changes for different databases.</td>
</tr>

<tr>
<td>Recommended for most applications.</td>
<td>Used for complex or database-specific queries.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<p><strong>JPQL</strong></p>

<pre><code>@Query("""
SELECT p
FROM Product p
WHERE p.category = :category
""")
List&lt;Product&gt; findProducts(
        @Param("category") String category);
</code></pre>

<p><strong>Native SQL</strong></p>

<pre><code>@Query(
value = """
SELECT *
FROM products
WHERE category = :category
""",
nativeQuery = true
)
List&lt;Product&gt; findProductsNative(
        @Param("category") String category);
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>JPQL works with Entities.</li>
<li>Native SQL works with database tables.</li>
<li>JPQL is portable across databases.</li>
<li>Use Native SQL only when JPQL cannot satisfy the requirement.</li>
</ul>

    id: 'sec',
    q: 'What is Spring Security?',
    a: `
<h3>📖 Definition</h3>

<p>
<strong>Spring Security</strong> is a powerful security framework that protects Spring applications by providing authentication, authorization, and protection against common security attacks.
</p>

<p>
It intercepts every incoming HTTP request before it reaches your Controller and decides whether the request should be allowed or denied.
</p>

<h3>🤔 Why do we need Spring Security?</h3>

<ul>
<li>Authenticate users.</li>
<li>Control access to APIs and resources.</li>
<li>Protect passwords using hashing.</li>
<li>Prevent common attacks like CSRF.</li>
<li>Support JWT, OAuth2, LDAP, and many authentication mechanisms.</li>
</ul>

<h3>⚙️ How it works</h3>

<ol>
<li>A client sends an HTTP request.</li>
<li>The request first enters the Spring Security Filter Chain.</li>
<li>Security filters authenticate the user.</li>
<li>If authentication succeeds, authorization checks are performed.</li>
<li>If the user has permission, the request reaches the Controller.</li>
<li>Otherwise, Spring returns 401 (Unauthorized) or 403 (Forbidden).</li>
</ol>

<h3>💻 Demo Code</h3>

<pre><code>@Configuration
@EnableWebSecurity
public class SecurityConfig {

    @Bean
    SecurityFilterChain securityFilterChain(
            HttpSecurity http) throws Exception {

        http
            .authorizeHttpRequests(auth -> auth
                .requestMatchers("/admin/**")
                .hasRole("ADMIN")
                .anyRequest()
                .authenticated()
            )
            .formLogin();

        return http.build();

    }

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Protects Spring applications.</li>
<li>Handles Authentication and Authorization.</li>
<li>Works using a Filter Chain.</li>
<li>Supports JWT, OAuth2, LDAP, Basic Auth, and Form Login.</li>
</ul>
`

<h3>📖 Definition</h3>

<p>
Spring Security processes every HTTP request through a series of security filters called the <strong>Security Filter Chain</strong>. Each filter performs a specific task such as authentication, authorization, session management, or CSRF protection.
</p>

<p>
Instead of Controllers handling security, these filters process the request before it reaches your application.
</p>

<h3>🤔 Why do we need the Filter Chain?</h3>

<ul>
<li>Authenticate users.</li>
<li>Validate JWT tokens.</li>
<li>Check user permissions.</li>
<li>Protect against security attacks.</li>
<li>Keep security separate from business logic.</li>
</ul>

<h3>⚙️ Request Flow</h3>

<pre><code>
Client
   │
   ▼
DelegatingFilterProxy
   │
   ▼
FilterChainProxy
   │
   ▼
SecurityFilterChain
   │
   ├── Authentication Filter
   ├── JWT Filter
   ├── Authorization Filter
   └── Other Security Filters
   │
   ▼
Controller
</code></pre>

<h3>💻 Demo Code</h3>

<pre><code>@Bean
SecurityFilterChain securityFilterChain(
        HttpSecurity http) throws Exception {

    http
        .authorizeHttpRequests(auth -> auth
            .anyRequest().authenticated()
        );

    return http.build();

}
</code></pre>

<h3>⭐ Key Points</h3>

<ul>
<li>Every request passes through the Filter Chain.</li>
<li>Filters execute in a specific order.</li>
<li>Security checks happen before the Controller is called.</li>
<li>Custom filters (such as JWT filters) can be added.</li>
</ul>
`

{
    id: 'sec',
    q: 'Authentication vs Authorization',
    a: `
<h3>📖 Definition</h3>

<p>
Authentication and Authorization are two different security concepts.
</p>

<ul>
<li><strong>Authentication</strong> verifies <strong>who the user is</strong>.</li>
<li><strong>Authorization</strong> determines <strong>what the authenticated user is allowed to do</strong>.</li>
</ul>

<h3>🤔 Why are both required?</h3>

<ul>
<li>Authentication identifies the user.</li>
<li>Authorization controls access to resources.</li>
<li>Together they secure the application.</li>
</ul>

<h3>⚙️ Authentication Flow</h3>

<pre><code>
User
   │
Username & Password
   │
   ▼
Authentication
   │
Valid?
   │
   ▼
SecurityContext
   │
   ▼
Authorization Check
   │
   ▼
Controller
</code></pre>

<h3>⚙️ Comparison</h3>

<table border="1" cellpadding="6">

<tr>
<th>Authentication</th>
<th>Authorization</th>
</tr>

<tr>
<td>Verifies identity.</td>
<td>Verifies permissions.</td>
</tr>

<tr>
<td>Happens first.</td>
<td>Happens after authentication.</td>
</tr>

<tr>
<td>Checks username/password or JWT.</td>
<td>Checks roles and authorities.</td>
</tr>

<tr>
<td>Returns an authenticated user.</td>
<td>Determines whether access is allowed.</td>
</tr>

</table>

<h3>💻 Demo Code</h3>

<pre><code>http
.authorizeHttpRequests(auth -> auth

    .requestMatchers("/admin/**")
    .hasRole("ADMIN")

    .requestMatchers("/user/**")
    .authenticated()

);
</code></pre>

<p>
The user must first be authenticated. Then Spring checks whether the user has the required role before allowing access.
</p>

<h3>⭐ Key Points</h3>

<ul>
<li>Authentication = Who are you?</li>
<li>Authorization = What can you access?</li>
<li>Authentication always happens before Authorization.</li>
<li>The authenticated user is stored in the SecurityContext.</li>
</ul>
`
